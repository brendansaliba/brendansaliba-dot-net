<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>projects | brendan saliba dot net</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="projects-page">
      <aside class="projects-list" aria-label="Projects">
        <h1>Projects</h1>
        <article class="project-tile">
          <a
            class="project-main-link"
            href="https://www.selsus.ai/projects/autonomous-drone-racing/index.html"
            rel="noreferrer"
          >
            <span class="project-copy">
              <span class="project-kicker">Autonomous Drone Racing</span>
              <span class="project-title">ai drone racing</span>
              <span class="project-description">
                A visual overview of the stack that turns camera evidence into
                metric pose estimates, gate maps, and flight commands.
              </span>
              <span class="project-tags" aria-label="Project themes">
                <span>Vision</span>
                <span>Geometry</span>
                <span>Control</span>
              </span>
            </span>
            <span class="project-visual" aria-hidden="true">
              <video
                class="project-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                poster="assets/projects/autonomous-drone-racing/video/racing-preview-poster.jpg"
              >
                <source
                  src="assets/projects/autonomous-drone-racing/video/racing-preview.webm"
                  type="video/webm"
                />
                <source
                  src="assets/projects/autonomous-drone-racing/video/racing-preview.mp4"
                  type="video/mp4"
                />
              </video>
            </span>
          </a>
          <span class="project-repo">
            Repo:
            <a href="https://github.com/HaleTruman/et-drone-hone" rel="noreferrer">
              github.com/HaleTruman/et-drone-hone
            </a>
          </span>
        </article>
      </aside>
    </main>
  </body>
</html>
